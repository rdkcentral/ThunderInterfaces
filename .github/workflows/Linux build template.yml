name: Linux build template

permissions:
  contents: read

on:
  workflow_call:

jobs:
  ThunderInterfaces:

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        build_type: [Debug, Release, MinSizeRel]
        architecture: [32, 64, tests64]

# ----- Packages & artifacts -----
    name: Build type - ${{matrix.build_type}}${{matrix.architecture == 'tests64' && ' tests' || matrix.architecture == '32' && ' x86' || ''}}
    steps:
    - name: Prepare apt (add i386 if needed)
      if: ${{ matrix.architecture == '32' }}
      run: |
        sudo dpkg --add-architecture i386

    - name: Update apt indices (with retries)
      shell: bash
      run: |
        set -euo pipefail
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ConnectTimeout=10 -o Dpkg::Lock::Timeout=60"
        MIRRORS=("archive.ubuntu.com/ubuntu" "mirror.ubuntu.com/ubuntu")
        mirror_index=-1
        switch_ubuntu_mirror() {
          local mirror="${MIRRORS[$mirror_index]}"
          echo "Switching Ubuntu mirror to http://${mirror}"
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i -E "s#^(URIs:[[:space:]]+|deb[[:space:]]+)[^[:space:]]+#\1http://${mirror}#" "$source_file"
            fi
          done
        }
        updated=0
        for attempt in {1..6}; do
          if [ "$attempt" -gt 2 ] && [ $(( (attempt - 1) % 2 )) -eq 0 ]; then
            mirror_index=$((mirror_index + 1))
            switch_ubuntu_mirror
          fi
          if timeout 300s sudo apt-get update ${APT_OPTS}; then
            updated=1
            break
          fi
          echo "apt-get update failed (attempt $attempt), retrying..."
          sleep $((attempt*10))
        done
        if [ "$updated" -ne 1 ]; then
          echo "apt-get update failed after trying 3 Ubuntu mirrors"
          exit 1
        fi

    - name: Install system dependencies
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ConnectTimeout=10 -o Dpkg::Lock::Timeout=60"
        MIRRORS=("archive.ubuntu.com/ubuntu" "mirror.ubuntu.com/ubuntu")
        mirror_index=-1
        switch_ubuntu_mirror() {
          local mirror="${MIRRORS[$mirror_index]}"
          echo "Switching Ubuntu mirror to http://${mirror}"
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i -E "s#^(URIs:[[:space:]]+|deb[[:space:]]+)[^[:space:]]+#\1http://${mirror}#" "$source_file"
            fi
          done
        }
        PKGS="python3-venv python3-pip build-essential cmake ninja-build libusb-1.0-0-dev"
        if [ "${{ matrix.architecture }}" = "32" ]; then
          PKGS="$PKGS zlib1g-dev:i386 libssl-dev:i386 libsbc-dev:i386 gcc-13-multilib g++-13-multilib"
        else
          PKGS="$PKGS zlib1g-dev libssl-dev libsbc-dev"
        fi
        installed=0
        for attempt in {1..6}; do
          if [ "$attempt" -gt 2 ] && [ $(( (attempt - 1) % 2 )) -eq 0 ]; then
            mirror_index=$((mirror_index + 1))
            switch_ubuntu_mirror
          fi
          if timeout 300s sudo apt-get install -y --no-install-recommends ${APT_OPTS} $PKGS; then
            installed=1
            break
          fi
          echo "apt-get install failed (attempt $attempt), cleaning up & retrying..."
          sleep $((attempt*15))
        done
        if [ "$installed" -ne 1 ]; then
          echo "apt-get install failed after trying 3 Ubuntu mirrors"
          exit 1
        fi

    - name: Set up Python environment
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install jsonref

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: Thunder-${{matrix.build_type}}${{matrix.architecture == 'tests64' && '-test' || matrix.architecture == '32' && '_x86' || ''}}-artifact
        path: ${{matrix.build_type}}

    - name: Unpack files
      run: |
        tar -xvzf ${{matrix.build_type}}/${{matrix.build_type}}${{matrix.architecture == '32' && '_x86' || ''}}.tar.gz
        rm ${{matrix.build_type}}/${{matrix.build_type}}${{matrix.architecture == '32' && '_x86' || ''}}.tar.gz

# ----- Regex & checkout -----
    - name: Checkout ThunderInterfaces - default
      if: ${{ !contains(github.event.pull_request.body, '[DependsOn=ThunderInterfaces:') }}
      uses: actions/checkout@v5
      with:
        path: ThunderInterfaces
        repository: rdkcentral/ThunderInterfaces

    - name: Regex ThunderInterfaces
      if: contains(github.event.pull_request.body, '[DependsOn=ThunderInterfaces:')
      id: thunderinterfaces
      uses: AsasInnab/regex-action@v1
      with:
        regex_pattern: '(?<=\[DependsOn=ThunderInterfaces:).*(?=\])'
        regex_flags: 'gim'
        search_string: ${{github.event.pull_request.body}}

    - name: Checkout ThunderInterfaces - ${{steps.thunderinterfaces.outputs.first_match}}
      if: contains(github.event.pull_request.body, '[DependsOn=ThunderInterfaces:')
      uses: actions/checkout@v5
      with:
        path: ThunderInterfaces
        repository: rdkcentral/ThunderInterfaces
        ref: ${{steps.thunderinterfaces.outputs.first_match}}

# ----- Building & uploading -----
    - name: Build ThunderInterfaces
      run: |
        source venv/bin/activate
        cmake -G Ninja -S ThunderInterfaces -B ${{matrix.build_type}}/build/ThunderInterfaces \
        -DCMAKE_CXX_FLAGS="-m${{matrix.architecture == 'tests64' && '64' || matrix.architecture}}" \
        -DCMAKE_C_FLAGS="-m${{matrix.architecture == 'tests64' && '64' || matrix.architecture}}" \
        -DCMAKE_INSTALL_PREFIX="${{matrix.build_type}}/install/usr" \
        -DCMAKE_MODULE_PATH="${PWD}/${{matrix.build_type}}/install/usr/include/WPEFramework/Modules"
        cmake --build ${{matrix.build_type}}/build/ThunderInterfaces --target install

    - name: Tar files
      run: tar -czvf ${{matrix.build_type}}${{matrix.architecture == '32' && '_x86' || ''}}.tar.gz ${{matrix.build_type}}

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ThunderInterfaces-${{matrix.build_type}}${{matrix.architecture == 'tests64' && '-test' || matrix.architecture == '32' && '_x86' || ''}}-artifact
        path: ${{matrix.build_type}}${{matrix.architecture == '32' && '_x86' || ''}}.tar.gz
